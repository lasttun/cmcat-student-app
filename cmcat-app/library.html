<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMCAT Library • ห้องสมุดดิจิทัล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
        }
        .input-focus { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .input-focus:focus {
            transform: scale(1.03);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 min-h-screen flex items-center justify-center p-4 overflow-hidden">
    
    <!-- Background decoration -->
    <div class="absolute inset-0 bg-[radial-gradient(at_center,#10b981_0%,transparent_70%)] opacity-10"></div>
    
    <div class="glass w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-8 text-white text-center">
            <div class="flex justify-center mb-4">
                <i class="fa-solid fa-book-open text-5xl opacity-90"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">CMCAT LIBRARY</h1>
            <p class="mt-1 text-emerald-100 text-lg">ศูนย์วิทยบริการฯ</p>
        </div>

        <div class="p-8">
            <!-- 🟢 เพิ่มระบบเลือกสถานะ เข้า-ออก -->
            <div class="flex gap-3 mb-6">
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="entryStatus" value="เข้าใช้งาน" class="peer hidden" checked>
                    <div class="py-3 rounded-xl text-center font-bold text-sm text-slate-500 bg-slate-50 border-2 border-slate-200 peer-checked:border-emerald-500 peer-checked:text-emerald-700 peer-checked:bg-emerald-50 transition-all shadow-sm">
                        📥 เข้าห้องสมุด
                    </div>
                </label>
                <label class="flex-1 cursor-pointer">
                    <input type="radio" name="entryStatus" value="ออกจากห้องสมุด" class="peer hidden">
                    <div class="py-3 rounded-xl text-center font-bold text-sm text-slate-500 bg-slate-50 border-2 border-slate-200 peer-checked:border-blue-500 peer-checked:text-blue-700 peer-checked:bg-blue-50 transition-all shadow-sm">
                        📤 ออกจากห้องสมุด
                    </div>
                </label>
            </div>

            <p class="text-center text-slate-500 mb-4 text-sm font-medium">
                กรอกรหัสนักเรียน นักศึกษาเพื่อบันทึกรายการ
            </p>
            
            <input type="text" id="studentId" 
                   class="input-focus w-full text-center text-4xl py-7 bg-white border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none font-mono tracking-widest shadow-inner"
                   placeholder="รหัสนักศึกษา" 
                   autofocus>
            
            <!-- Result Message -->
            <div id="result-message" class="hidden mt-6 p-5 rounded-2xl font-bold text-lg text-center shadow-inner"></div>
        </div>

        <!-- Footer -->
        <div class="border-t border-slate-100 py-4 text-center text-xs text-slate-400">
            ระบบจัดการห้องสมุด • วิทยาลัยเกษตรและเทคโนโลยีเชียงใหม่ © 2026
        </div>
    </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbztsC4Wng1zDAVyNmHka6N00m1os6aHGqcZV2LW1l1NBrlATIWPLzwdORzU4lP_P6_p/exec";
    const input = document.getElementById('studentId');
    const messageDiv = document.getElementById('result-message');

    function showMessage(success, text, status) {
        if (success) {
            // 🟢 เปลี่ยนสีและข้อความให้สอดคล้องกับสถานะ
            if (status === 'เข้าใช้งาน') {
                messageDiv.className = "mt-6 p-5 rounded-2xl font-bold text-lg text-center bg-emerald-50 border border-emerald-200 text-emerald-800 shadow-inner animate-in zoom-in duration-200";
                messageDiv.innerHTML = `<i class="fa-solid fa-check-circle text-3xl mb-2 block text-emerald-600"></i> ยินดีต้อนรับ<br><span class="text-2xl">${text}</span>`;
            } else {
                messageDiv.className = "mt-6 p-5 rounded-2xl font-bold text-lg text-center bg-blue-50 border border-blue-200 text-blue-800 shadow-inner animate-in zoom-in duration-200";
                messageDiv.innerHTML = `<i class="fa-solid fa-sign-out-alt text-3xl mb-2 block text-blue-600"></i> ขอบคุณที่ใช้บริการ<br><span class="text-2xl">${text}</span>`;
            }
        } else {
            messageDiv.className = "mt-6 p-5 rounded-2xl font-bold text-lg text-center bg-red-50 border border-red-200 text-red-700 shadow-inner animate-in zoom-in duration-200";
            messageDiv.innerHTML = `<i class="fa-solid fa-circle-xmark text-3xl mb-2 block text-red-600"></i> ${text}`;
        }
        messageDiv.classList.remove('hidden');
    }

    function resetInput() {
        setTimeout(() => {
            input.disabled = false;
            input.value = "";
            input.focus();
            messageDiv.classList.add('hidden');
        }, 2800);
    }

    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const studentId = input.value.trim();
            // 🟢 ดึงสถานะที่ผู้ใช้เลือก (เข้า/ออก)
            const status = document.querySelector('input[name="entryStatus"]:checked').value;
            
            if (!studentId) return;

            input.value = "กำลังบันทึก...";
            input.disabled = true;

            fetch(GAS_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify({
                    action: 'recordLibraryEntry',
                    payload: { studentId: studentId, status: status }
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(true, data.name, status);
                } else {
                    showMessage(false, data.message || "ไม่สามารถบันทึกได้", status);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage(false, "เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง", status);
            })
            .finally(() => {
                resetInput();
            });
        }
    });

    window.onload = () => input.focus();
</script>
</body>
</html>
