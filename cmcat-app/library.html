<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>CMCAT Library • ห้องสมุดดิจิทัล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); }
        .input-focus { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-focus:focus {
            transform: scale(1.03);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 min-h-screen flex items-center justify-center p-4 overflow-hidden">
    
    <!-- Background decoration -->
    <div class="absolute inset-0 bg-[radial-gradient(at_center,#10b981_0%,transparent_70%)] opacity-10"></div>
    
    <div class="glass w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-8 text-white text-center">
            <div class="flex justify-center mb-4">
                <i class="fa-solid fa-book-open text-5xl opacity-90"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">CMCAT LIBRARY</h1>
            <p class="mt-1 text-emerald-100 text-lg">ห้องสมุดดิจิทัล</p>
        </div>

        <div class="p-8">
            <p class="text-center text-slate-500 mb-8 text-sm font-medium">
                สแกนบัตรนักเรียน หรือกรอกรหัสเพื่อเข้าใช้งาน
            </p>
            
            <input type="text" id="studentId" 
                   class="input-focus w-full text-center text-4xl py-7 bg-white border-2 border-slate-200 rounded-2xl focus:border-emerald-500 outline-none font-mono tracking-widest shadow-inner"
                   placeholder="รหัสนักศึกษา" 
                   autofocus>
            
            <!-- Result Message -->
            <div id="result-message" class="hidden mt-6 p-5 rounded-2xl font-bold text-lg text-center shadow-inner"></div>
        </div>

        <!-- Footer -->
        <div class="border-t border-slate-100 py-4 text-center text-xs text-slate-400">
            ระบบจัดการห้องสมุด • วิทยาลัยเกษตรและเทคโนโลยีเชียงใหม่ &copy; 2025
        </div>
    </div>

    <script>
        const input = document.getElementById('studentId');
        
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const id = input.value.trim();
                if (!id) return;

                // Visual feedback
                input.value = "กำลังบันทึก...";
                input.disabled = true;

                google.script.run
                    .withSuccessHandler(res => {
                        const msg = document.getElementById('result-message');
                        
                        if (res.success) {
                            msg.className = "hidden mt-6 p-5 rounded-2xl font-bold text-lg text-center bg-emerald-50 border border-emerald-200 text-emerald-800 shadow-inner";
                            msg.innerHTML = `
                                <i class="fa-solid fa-check-circle text-3xl mb-2 block"></i>
                                ยินดีต้อนรับ<br><span class="text-2xl">${res.name}</span>
                            `;
                        } else {
                            msg.className = "hidden mt-6 p-5 rounded-2xl font-bold text-lg text-center bg-red-50 border border-red-200 text-red-700 shadow-inner";
                            msg.innerHTML = `
                                <i class="fa-solid fa-circle-xmark text-3xl mb-2 block"></i>
                                ${res.message}
                            `;
                        }
                        
                        msg.classList.remove('hidden');

                        setTimeout(() => {
                            input.disabled = false;
                            input.value = "";
                            input.focus();
                            msg.classList.add('hidden');
                        }, 2500);
                    })
                    .recordLibraryEntry(id);
            }
        });

        // Auto focus when page loads
        window.onload = () => input.focus();
    </script>
</body>
</html>
